<form id="frmDocente">
    <div class="card theme-secondary" style="min-width:700px;">
        <div class="card-header">
            <div class="d-flex">
                Administracion de Docentes

                <div class="ms-auto">
                    <button data-ng-form="docente" type="button" class="btn-close" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row p-1">
                <div class="col-3 col-md-2">CODIGO</div>
                <div class="col-9 col-md-4">
                    <input type="text" class="form-control" id="txtCodigoDocente" name="txtCodigoDocente" maxlength="10" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">NOMBRE</div>
                <div class="col-9 col-md-8">
                    <input type="text" class="form-control" id="txtNombreDocente" name="txtNombreDocente" maxlength="100" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">DIRECCION</div>
                <div class="col-9 col-md-10">
                    <input type="text" class="form-control" id="txtDireccionDocente" name="txtDireccionDocente" maxlength="150" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">TELEFONO</div>
                <div class="col-9 col-md-4">
                    <input type="text" class="form-control" id="txtTelefonoDocente" name="txtTelefonoDocente" maxlength="10" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">EMAIL</div>
                <div class="col-9 col-md-6">
                    <input type="text" class="form-control" id="txtEmailDocente" name="txtEmailDocente" maxlength="100" />
                </div>
            </div>
        </div>
        <div class="card-footer fg-2">
            <div class="col-12 text-center">
                <input type="submit" class="btn btn-outline-primary" value="Guardar" />
                <input type="reset" class="btn btn-outline-warnig" value="Nuevo" />
                <input onclick="abrirVentana('busqueda_docente')" type="button" class="btn btn-outline-success" value="Buscar" />
            </div>
        </div>
    </div>
</form>
<script>
var accionDocente = 'nuevo',
    idDocente = 0;
frmDocente.addEventListener('submit', e => {
    e.preventDefault();
    guardarDocente();
});
frmDocente.addEventListener('reset', e => {
    e.preventDefault();
    nuevoDocente();
});
async function guardarDocente() {
    let datos = {
        codigo: txtCodigoDocente.value,
        nombre: txtNombreDocente.value,
        direccion: txtDireccionDocente.value,
        telefono: txtTelefonoDocente.value,
        email: txtEmailDocente.value,
    },
        url = '/api/Docentes',
        method = 'POST';
    if (accionDocente == 'modificar') {
        method = 'PUT';
        url = `/api/Docentes/${idDocente}`;
        datos.idDocente = idDocente;
    }
    const respuesta = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
    }), docente = await respuesta.json();
    if ((docente?.idDocente || 0) > 0) {
        nuevoDocente();
        if (typeof listarDocentes === 'function') listarDocentes(window.txtBuscarDocente?.value || '');
    }
}
function nuevoDocente() {
    accionDocente = "nuevo";
    idDocente = 0;
    txtCodigoDocente.value = "";
    txtNombreDocente.value = "";
    txtDireccionDocente.value = "";
    txtTelefonoDocente.value = "";
    txtEmailDocente.value = "";
}
function modificarDocente(docente) {
    accionDocente = "modificar";
    idDocente = docente.idDocente;
    txtCodigoDocente.value = (docente.codigo || "").trim();
    txtNombreDocente.value = (docente.nombre || "").trim();
    txtDireccionDocente.value = (docente.direccion || "").trim();
    txtTelefonoDocente.value = (docente.telefono || "").trim();
    txtEmailDocente.value = (docente.email || "").trim();
}
</script>
