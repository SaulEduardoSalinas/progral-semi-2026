<form id="frmMateria">
    <div class="card theme-secondary" style="min-width:700px;">
        <div class="card-header">
            <div class="d-flex">
                Administracion de Materias

                <div class="ms-auto">
                    <button data-ng-form="materia" type="button" class="btn-close" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row p-1">
                <div class="col-3 col-md-2">CODIGO</div>
                <div class="col-9 col-md-4">
                    <input type="number" class="form-control" id="txtCodigoMateria" name="txtCodigoMateria" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">NOMBRE</div>
                <div class="col-9 col-md-8">
                    <input type="text" class="form-control" id="txtNombreMateria" name="txtNombreMateria" maxlength="100" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">UV</div>
                <div class="col-9 col-md-2">
                    <input type="number" min="0" max="255" class="form-control" id="txtUvMateria" name="txtUvMateria" />
                </div>
            </div>
        </div>
        <div class="card-footer fg-2">
            <div class="col-12 text-center">
                <input type="submit" class="btn btn-outline-primary" value="Guardar" />
                <input type="reset" class="btn btn-outline-warnig" value="Nuevo" />
                <input onclick="abrirVentana('busqueda_materia')" type="button" class="btn btn-outline-success" value="Buscar" />
            </div>
        </div>
    </div>
</form>
<script>
var accionMateria = 'nuevo',
    idMateria = 0;
frmMateria.addEventListener('submit', e => {
    e.preventDefault();
    guardarMateria();
});
frmMateria.addEventListener('reset', e => {
    e.preventDefault();
    nuevoMateria();
});
async function guardarMateria() {
    let datos = {
        codigo: txtCodigoMateria.value === '' ? null : parseInt(txtCodigoMateria.value),
        nombre: txtNombreMateria.value,
        uv: txtUvMateria.value === '' ? null : parseInt(txtUvMateria.value),
    },
        url = '/api/Materias',
        method = 'POST';
    if (accionMateria == 'modificar') {
        method = 'PUT';
        url = `/api/Materias/${idMateria}`;
        datos.idMateria = idMateria;
    }
    const respuesta = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
    }), materia = await respuesta.json();
    if ((materia?.idMateria || 0) > 0) {
        nuevoMateria();
        if (typeof listarMaterias === 'function') listarMaterias(window.txtBuscarMateria?.value || '');
    }
}
function nuevoMateria() {
    accionMateria = "nuevo";
    idMateria = 0;
    txtCodigoMateria.value = "";
    txtNombreMateria.value = "";
    txtUvMateria.value = "";
}
function modificarMateria(materia) {
    accionMateria = "modificar";
    idMateria = materia.idMateria;
    txtCodigoMateria.value = materia.codigo ?? "";
    txtNombreMateria.value = (materia.nombre || "").trim();
    txtUvMateria.value = materia.uv ?? "";
}
</script>
